name: Rust の動作確認

on:
  push:
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"

jobs:
  test:
    name: テストと整形
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: コードを取得
        uses: actions/checkout@v4
      - name: Rust環境を確認
        run: |
          rustc --version
          cargo --version
      - name: コードの整形を確認
        run: cargo fmt --all -- --check
      - name: 単体テスト
        run: cargo test --all-targets
      - name: Scannerテンプレートをコンパイル
        run: rustc --edition=2021 templates/abc.rs -o /tmp/atcoder-kit-scanner
      - name: 提出テンプレートの原本と署名付き版をコンパイル
        run: |
          rustc --edition=2021 templates/contest.rs -o /tmp/atcoder-kit-contest-source
          rustc --edition=2021 template.rs -o /tmp/atcoder-kit-signed-template
      - name: テンプレートreadで改行をまたぐ入力を検証
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path("templates/contest.rs").read_text(encoding="utf-8")
          marker = "fn main(){}\n"
          assert src.count(marker) == 1
          main = """fn main() {
              let n: usize = read();
              let a: Vec<i64> = (0..n).map(|_| read()).collect();
              let s: String = read();
              println!("{} {s}", a.iter().sum::<i64>());
          }
          """
          Path("/tmp/atcoder-kit-read.rs").write_text(src.replace(marker, main), encoding="utf-8")
          PY
          rustc --edition=2021 /tmp/atcoder-kit-read.rs -o /tmp/atcoder-kit-read
          actual=$(printf ' \t4\n10 20\n30 40\nlast' | /tmp/atcoder-kit-read)
          test "$actual" = "100 last"
      - name: 行単位スニペットのサンプルを実行
        run: |
          rustc --edition=2021 templates/line_input.rs -o /tmp/atcoder-kit-line-input
          actual=$(printf '10 20 30\nhello\n' | /tmp/atcoder-kit-line-input)
          test "$actual" = "60 hello"
      - name: VSCode用スニペットを検証
        run: |
          python3 -c "import json; from pathlib import Path; d=json.loads(Path('snippets/rust.json').read_text()); p=[a for v in d.values() for a in (v['prefix'] if isinstance(v['prefix'], list) else [v['prefix']])]; assert len(p)==len(set(p)); assert all(v.get('body') for v in d.values())"
      # proconioのサンプルはコンテスト用Cargo.tomlに依存が必要。
      # このライブラリ本体には依存を増やさず、当面はドキュメント扱いとする。
