name: 署名付きRustテンプレートを更新

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signed-rust-template-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 最新のmainを取得
        run: |
          git fetch origin main
          git checkout --detach origin/main

      - name: 公開済み原本のコミットSHAを署名に埋め込む
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          export SOURCE_SHA
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["SOURCE_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise ValueError("不正なコミットSHA")

          source = Path("rust/templates/contest.rs").read_text(encoding="utf-8")
          header = (
              f"// GH: rebuildup | AtCoder: rebuild | Data use: unrestricted\n"
              f"// github.com/{repo}/tree/{sha[:12]}\n\n"
          )
          footer = "\n// Notes / refs:\n// -\n"
          Path("rust/template.rs").write_text(header + source + footer, encoding="utf-8")
          PY

      - name: 生成結果を検証
        run: |
          rustc --edition=2021 rust/template.rs -o /tmp/atcoder-kit-signed-template

      - name: 変更時だけコミット
        run: |
          git add rust/template.rs
          git diff --cached --check
          if git diff --cached --quiet -- rust/template.rs; then
            echo "署名は最新のため更新不要"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "署名付きRustテンプレートを最新コミットに更新"
          git push origin HEAD:main
